[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llms-txt"
dynamic = ["version"]
description = "The /llms.txt file, helping language models use your website"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python', 'LLMs', 'NLP']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['fastcore>=1.12.9', 'httpx', 'mistletoe']

[project.urls]
Repository = "https://github.com/AnswerDotAI/llms-txt"
Documentation = "https://llmstxt.org/"

[project.entry-points.nbdev]
llms_txt = "llms_txt._modidx:d"


[project.scripts]
llms_txt2ctx = "llms_txt.core:llms_txt2ctx"
llms_txt2html = "llms_txt.txt2html:main"

[tool.setuptools.dynamic]
version = {attr = "llms_txt.__version__"}

[tool.setuptools.packages.find]
include = ["llms_txt"]

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai']
custom_sidebar = true

[tool.chkstyle]
skip_paths = ["_modidx.py"]
